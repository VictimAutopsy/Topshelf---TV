<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TopShelf</title>
<style>
@font-face { font-family: Inter; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: Inter; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: Inter; src: url(fonts/Inter-SemiBold.otf); font-weight: 600 700; }

:root {
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .5, 1);
  --tw: 19.4rem;              /* tile width: 5 across a 1920px screen */
  --th: calc(var(--tw) * 9 / 16);
  --glass: rgba(42, 42, 46, .58);
  --glass-hi: rgba(255, 255, 255, .14);
  --text-dim: rgba(255, 255, 255, .62);
  --scroll: 0rem;
}
/* 1rem = 16px on a 1920x1080 screen, always 16:9 */
html { font-size: min(calc(100vw / 120), calc(100vh / 67.5)); }
/* phone held upright: the screen is 64rem wide */
@media (max-aspect-ratio: 20/21) { html { font-size: min(calc(100vw / 64), calc(100vh / 100)); } }
html, body {
  margin: 0; height: 100%; overflow: hidden; overflow: clip;   /* clip: the page itself can never be scrolled */ background: #000; color: #fff;
  font-family: Inter, "Google Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; cursor: none; user-select: none;
}
/* The stage fills the whole screen. 1rem is sized so a 16:9 area fits; wider screens (phones)
   get extra width, which the layout uses (more dock columns, wider guide). */
:root { --sw: 120; --sh: 67.5; --safe-l: 0px; --safe-r: 0px; --safe-t: 0px; --safe-b: 0px; }
/* The stage (all controls) stays clear of the camera cutout; the photo and full-screen video
   reach past it to the real screen edges. */
#stage {
  position: absolute; left: var(--safe-l); right: var(--safe-r); top: 0; bottom: 0; overflow: visible; background: #000;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}

/* ---------- Background photos ---------- */
#bg {
  position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--safe-l)); right: calc(-1 * var(--safe-r));
  overflow: hidden; transition: filter .6s var(--ease), scale .6s var(--ease);
}
.bgimg {
  position: absolute; inset: -3%; background: center / cover no-repeat;
  opacity: 0; transition: opacity 1.6s ease; will-change: opacity, transform;
}
.bgimg.show { opacity: 1; }
.bgimg.kb { animation: kb var(--kbdur, 40s) linear forwards; }
@keyframes kb {
  from { transform: scale(1.0) translate(0, 0); }
  to   { transform: scale(1.09) translate(var(--kx, -1%), var(--ky, -1%)); }
}
body.still .bgimg.kb, body.deep .bgimg.kb, body.paused .bgimg.kb { animation-play-state: paused; }
#aurora {
  position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease;
  background:
    radial-gradient(60% 70% at 18% 20%, #2b4b9b 0%, transparent 60%),
    radial-gradient(55% 60% at 85% 15%, #6a2f8a 0%, transparent 60%),
    radial-gradient(70% 70% at 60% 85%, #0f5c6e 0%, transparent 65%),
    #0b0d18;
}
body.nophotos #aurora { opacity: 1; }
body.deep #bg { filter: brightness(.6) saturate(1.15); scale: 1.03; }
body.settings-open #bg { filter: brightness(.7); }

#scrim {
  position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--safe-l)); right: calc(-1 * var(--safe-r)); pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 38%,
    rgba(0,0,0,.08) 62%, rgba(0,0,0,.45) 100%);
  transition: opacity .6s var(--ease);
}
body.shelf #scrim { opacity: .55; }

/* ---------- Clock & caption ---------- */
#topbar {
  position: absolute; top: 2.6rem; right: 6rem; display: flex; align-items: center; gap: 1.1rem; z-index: 30;
}
.tb {
  position: relative; width: 3.8rem; height: 3.8rem; border-radius: 50%; display: grid; place-items: center;
  color: #fff; background: rgba(40, 40, 44, .42);
  backdrop-filter: blur(1.2rem) saturate(1.5); -webkit-backdrop-filter: blur(1.2rem) saturate(1.5);
  box-shadow: 0 .3rem 1rem rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.1);
  transition: scale .22s var(--ease), background .2s, color .2s, opacity .4s;
}
.tb svg { width: 1.9rem; height: 1.9rem; }
.tb .tip {
  position: absolute; top: 4.7rem; left: 50%; translate: -50% -.3rem; font-size: 1.05rem; font-weight: 500;
  white-space: nowrap; color: #fff; opacity: 0; transition: opacity .2s, translate .2s; text-shadow: 0 .1rem .6rem rgba(0,0,0,.6);
}
.tb.sel { background: #fff; color: #111; scale: 1.14; }
.tb.sel .tip { opacity: 1; translate: -50% 0; }
body.shelf .tb, body.shelf #topbar { opacity: 0; pointer-events: none; }
#clock {
  margin-left: .8rem; font-size: 2rem; font-weight: 500;
  letter-spacing: -.01em; text-shadow: 0 .1rem .8rem rgba(0,0,0,.45);
  font-variant-numeric: tabular-nums; transition: opacity .4s;
}
body.clock-off #clock { opacity: 0; }

#caption {
  position: absolute; left: 6rem; top: 37.6rem; translate: 0 -100%; max-width: 62rem;
  text-shadow: 0 .1rem 1rem rgba(0,0,0,.55);
  transition: opacity .5s var(--ease), top .6s var(--ease), translate .5s var(--ease);
}
#caption .sub { font-size: 1.05rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
#caption .title {
  font-size: 2rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.18; margin-top: .45rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  transition: font-size .6s var(--ease);
}
#caption .by { font-size: 1.1rem; color: var(--text-dim); margin-top: .5rem; }
#caption.swap { opacity: 0; translate: 0 calc(-100% + .6rem); }
body.deep #caption { opacity: 0; }
body.shelf #caption { top: 60rem; }
/* The photo's title only shows in photo mode, not above the apps. */
body:not(.shelf) #caption { opacity: 0; }
body.shelf #caption .title { font-size: 3rem; }
body.nophotos #caption { opacity: 0; }

#shelfhint {
  position: absolute; right: 6rem; bottom: 5.4rem; font-size: 1.1rem; color: var(--text-dim);
  opacity: 0; transition: opacity .5s; text-shadow: 0 .1rem .6rem rgba(0,0,0,.6);
}
body.shelf #shelfhint { opacity: 1; }
#pausebadge {
  position: absolute; top: 3.2rem; left: 6rem; font-size: 1.1rem; font-weight: 600;
  padding: .5rem 1rem; border-radius: 2rem; background: var(--glass);
  backdrop-filter: blur(1.5rem); opacity: 0; transition: opacity .3s;
}
body.paused #pausebadge { opacity: 1; }

/* ---------- Home grid ---------- */
#content {
  position: absolute; inset: 0; translate: 0 0;
  transition: translate .55s var(--ease), opacity .45s var(--ease);
}
body.shelf #content { opacity: 0; translate: 0 10rem; pointer-events: none; }
body.deep #content { opacity: 0; translate: 0 6rem; pointer-events: none; }

/* All-apps drawer: hidden below the screen, slides up when you go down from the dock */
#drawer {
  position: absolute; left: 3rem; right: 3rem; top: 8.8rem; bottom: 2.2rem; border-radius: 3.4rem;
  overflow: hidden; translate: 0 calc(100% + 5rem); opacity: 0; z-index: 5;
}
body.deep #drawer { translate: 0 0; opacity: 1; }
body.shelf #drawer { opacity: 0; translate: 0 calc(100% + 5rem); }
#gridscroll {
  position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  touch-action: pan-y; scrollbar-width: none; overflow-anchor: none;
}
#gridscroll::-webkit-scrollbar { display: none; }
#gridwrap { position: relative; width: 100%; }
#dockcells { position: absolute; inset: 0; pointer-events: none; }
#dockcells .cell { pointer-events: auto; }

#hint {
  position: absolute; left: 50%; bottom: .55rem; translate: -50% 0; display: flex; align-items: center; gap: .35rem;
  font-size: .95rem; font-weight: 500; color: rgba(255,255,255,.72); text-shadow: 0 .1rem .5rem rgba(0,0,0,.6);
  opacity: 0; transition: opacity .4s; pointer-events: none;
}
#hint svg { width: 1rem; height: 1rem; animation: nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { translate: 0 0; } 82% { translate: 0 .25rem; } }
body.hasdrawer:not(.deep):not(.shelf) #hint { opacity: 1; pointer-events: auto; }

#dock {
  position: absolute; left: 0; right: 0; top: 39.4rem; height: calc(var(--th) + 6.2rem);
  background: linear-gradient(to bottom, rgba(255,255,255,.13), rgba(255,255,255,.07));
  backdrop-filter: blur(2.2rem) saturate(1.7);
  -webkit-backdrop-filter: blur(2.2rem) saturate(1.7);
  border-top: 1px solid rgba(255,255,255,.14);
  transition: opacity .5s var(--ease);
}
body.deep #dock, body.deep .cell.r0 { opacity: 0; }

.cell {
  position: absolute; left: 0; top: 0; width: var(--tw);
  translate: var(--x) var(--y);
  transition: translate .38s var(--ease), opacity .3s;
}
.tile {
  position: relative; width: var(--tw); height: var(--th); border-radius: .85rem; overflow: hidden;
  background: #232326; scale: 1; translate: 0 0;
  box-shadow: 0 .4rem 1rem rgba(0,0,0,.35);
  transition: scale .26s var(--ease), box-shadow .26s var(--ease), translate .2s var(--ease);
  will-change: scale;
}
img { -webkit-user-drag: none; user-select: none; pointer-events: none; }
.tile img.banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile img.ico {
  position: absolute; left: 50%; top: 50%; height: 56%; translate: -50% -50%;
  filter: drop-shadow(0 .3rem .8rem rgba(0,0,0,.35));
}
.tile .glyph {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 4.2rem; font-weight: 600; letter-spacing: -.03em; color: rgba(255,255,255,.92);
}
.tile .gloss {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(130% 85% at 50% -15%, rgba(255,255,255,.28), rgba(255,255,255,0) 60%);
}
.tile .shine {
  position: absolute; inset: -10%; pointer-events: none; translate: -130% 0;
  background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.26) 50%, transparent 62%);
}
.label {
  position: absolute; left: -25%; width: 150%; top: calc(var(--th) * 1.06 + .9rem);
  text-align: center; font-size: 1.3rem; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; opacity: 0; translate: 0 -.5rem;
  text-shadow: 0 .1rem .6rem rgba(0,0,0,.5);
  transition: opacity .22s var(--ease), translate .22s var(--ease);
}

.cell.focus { z-index: 10; }
.cell.focus .tile { scale: 1.12; box-shadow: 0 2.2rem 3rem rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
.cell.focus .gloss { opacity: 1; }
.cell.focus .shine { animation: shine 1s var(--ease) .12s 1 both; }
.cell.focus .label { opacity: 1; translate: 0 0; }
@keyframes shine { to { translate: 130% 0; } }

.cell.press .tile { scale: 1.04; transition-duration: .1s; }
.cell.bump-l .tile { animation: bumpL .32s var(--ease); }
.cell.bump-r .tile { animation: bumpR .32s var(--ease); }
.cell.bump-u .tile { animation: bumpU .32s var(--ease); }
.cell.bump-d .tile { animation: bumpD .32s var(--ease); }
@keyframes bumpL { 40% { translate: -.7rem 0; } }
@keyframes bumpR { 40% { translate: .7rem 0; } }
@keyframes bumpU { 40% { translate: 0 -.6rem; } }
@keyframes bumpD { 40% { translate: 0 .6rem; } }

.cell.moving { z-index: 20; transition: translate .2s var(--ease); }
.cell.moving .tile { scale: 1.16; animation: wiggle .26s ease-in-out infinite alternate; }
.cell.moving .label { opacity: 1; translate: 0 0; }
@keyframes wiggle { from { rotate: -1.3deg; } to { rotate: 1.3deg; } }
body.move .cell:not(.moving) { opacity: .55; }

.tile.gear { background: linear-gradient(160deg, #3a3a40, #1d1d21); }
.tile.gear svg { position: absolute; left: 50%; top: 50%; width: 4.4rem; translate: -50% -50%; opacity: .9; }

/* ---------- Context menu ---------- */
#menu {
  position: absolute; min-width: 19rem; padding: .7rem; border-radius: 1.4rem; z-index: 50;
  background: var(--glass); backdrop-filter: blur(2.6rem) saturate(1.6);
  -webkit-backdrop-filter: blur(2.6rem) saturate(1.6);
  box-shadow: 0 2rem 4rem rgba(0,0,0,.5);
  opacity: 0; scale: .92; pointer-events: none; transform-origin: top left;
  transition: opacity .2s var(--ease), scale .25s var(--spring);
}
#menu.open { opacity: 1; scale: 1; pointer-events: auto; }
.mi {
  display: flex; align-items: center; gap: 1rem; padding: 1rem 1.3rem; border-radius: .9rem;
  font-size: 1.35rem; font-weight: 500; transition: background .15s, color .15s, scale .2s var(--ease);
}
.mi svg { width: 1.5rem; height: 1.5rem; flex: none; }
.mi.sel { background: #fff; color: #111; scale: 1.03; }

/* ---------- Settings sheet ---------- */
#settings {
  position: absolute; top: 0; right: 0; bottom: 0; width: 44rem; z-index: 40;
  background: rgba(28, 28, 31, .72); backdrop-filter: blur(3rem) saturate(1.6);
  -webkit-backdrop-filter: blur(3rem) saturate(1.6);
  box-shadow: -2rem 0 5rem rgba(0,0,0,.4);
  padding: 4.5rem 3rem 3rem; box-sizing: border-box;
  translate: 105% 0; transition: translate .45s var(--ease);
}
body.settings-open #settings { translate: 0 0; }
#settings h1 { font-size: 2.6rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 2rem 1.4rem; }
.srow {
  display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
  padding: 1.15rem 1.4rem; border-radius: 1rem; font-size: 1.35rem; font-weight: 500;
  transition: background .15s, color .15s, scale .2s var(--ease);
}
.srow .val { color: var(--text-dim); display: flex; align-items: center; gap: .6rem; white-space: nowrap; }
.srow .val .ar { opacity: 0; font-weight: 600; transition: opacity .15s; }
.srow.sel { background: #fff; color: #111; scale: 1.02; }
.srow.sel .val { color: rgba(0,0,0,.6); }
.srow.sel .val .ar { opacity: 1; }
.srow.sec { padding-top: 1.35rem; padding-bottom: 1.35rem; }
.srow.sec > span:first-child { font-size: 1.5rem; font-weight: 600; white-space: nowrap; }
.srow.sec .val { font-size: 1.05rem; white-space: normal; text-align: right; max-width: 18rem; }
.srow .chev { font-size: 1.6rem; font-weight: 600; margin-left: .4rem; opacity: .6; }
#settings h1 .sback { display: block; font-size: 1.15rem; font-weight: 500; color: var(--text-dim); margin-bottom: .4rem; letter-spacing: 0; }
.srow.gap { margin-top: 1.4rem; }
.shead { font-size: 1.05rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); padding: 1.6rem 1.4rem .5rem; }
.shead:first-child { padding-top: .2rem; }
.srow input {
  font: inherit; font-size: 1.35rem; width: 15rem; padding: .4rem .8rem; border-radius: .6rem;
  border: 2px solid #0a84ff; outline: none; background: #fff; color: #111;
}
#settings .foot { position: absolute; left: 4.4rem; right: 3rem; bottom: 2.4rem; font-size: 1rem; line-height: 1.4; color: var(--text-dim); }

/* ---------- Toast ---------- */
#toast {
  position: absolute; left: 50%; bottom: 4rem; translate: -50% 1rem; z-index: 60;
  padding: 1rem 1.8rem; border-radius: 2rem; font-size: 1.25rem; font-weight: 500;
  background: var(--glass); backdrop-filter: blur(2rem); -webkit-backdrop-filter: blur(2rem);
  opacity: 0; transition: opacity .3s, translate .3s var(--ease); pointer-events: none;
}
#toast.show { opacity: 1; translate: -50% 0; }
/* ==================== Liquid Glass ==================== */
@property --fx { syntax: '<percentage>'; inherits: true; initial-value: 10%; }
@property --la { syntax: '<angle>'; inherits: true; initial-value: 120deg; }
.glass {
  isolation: isolate;
  box-shadow: 0 1.8rem 4rem rgba(0,0,0,.30), inset 0 0 1.8rem rgba(255,255,255,.06);
  transition: --fx .55s var(--ease), --la .7s var(--ease), opacity .5s var(--ease), translate .5s var(--ease), scale .25s var(--spring);
}
/* bright rim of light around the glass edge; its angle follows your focus */
.glass::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: .13rem; pointer-events: none; z-index: 2;
  background: linear-gradient(var(--la), rgba(255,255,255,.85), rgba(255,255,255,.16) 20%, rgba(255,255,255,0) 42%,
              rgba(255,255,255,.05) 68%, rgba(255,255,255,.5)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
body.glass-solid .glass::after { opacity: .35; }

#dock { left: 3rem; right: 3rem; border-radius: 3.4rem; border-top: none; }
/* soft specular glow inside the dock that slides to the focused app */
#dock::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(30rem 11rem at var(--fx) -10%, rgba(255,255,255,.24), rgba(255,255,255,0) 70%);
}

#topbar { top: 2.3rem; right: 4.6rem; gap: .5rem; padding: .5rem 1.4rem .5rem .5rem; border-radius: 3rem; }
.tb { width: 3.8rem; height: 3.8rem; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.tb.sel { background: rgba(255,255,255,.95); color: #111; }
#clock { font-size: 1.75rem; margin-left: .6rem; }

#settings {
  top: 2rem; right: 2rem; bottom: 2rem; width: 42rem; border-radius: 3rem;
  padding: 3.6rem 2.6rem 2.6rem; translate: calc(100% + 3rem + var(--safe-r)) 0; box-shadow: 0 2rem 5rem rgba(0,0,0,.45);
}
.srow { border-radius: 1.5rem; padding-top: 1rem; padding-bottom: 1rem; }
#srows {
  max-height: calc(100% - 9.6rem); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  scrollbar-width: none; margin: 0 -1rem; padding: .3rem 1rem; overflow-anchor: none;
}
#srows::-webkit-scrollbar { display: none; }
#settings h1 { margin-bottom: 1.4rem; }
#settings .foot { left: 4rem; bottom: 2.2rem; }
#menu { border-radius: 2.2rem; padding: .8rem; }
.mi { border-radius: 1.4rem; }
#toast { border-radius: 3rem; }
#pausebadge { border-radius: 3rem; }

/* glass edges on app tiles */
.tile .rim {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  box-shadow: inset 0 .1rem 0 rgba(255,255,255,.38), inset 0 0 0 .07rem rgba(255,255,255,.14), inset 0 -.1rem 0 rgba(0,0,0,.25);
}
.cell { perspective: 80rem; }
.tile { rotate: var(--rot, y 0deg); transition: scale .26s var(--ease), box-shadow .26s var(--ease), translate .2s var(--ease), rotate .5s var(--spring); }
.cell.focus .tile { box-shadow: 0 2.4rem 3.2rem rgba(0,0,0,.5), 0 0 0 .07rem rgba(255,255,255,.18), 0 0 3rem rgba(255,255,255,.08); }
.cell.focus.rev .shine { animation-name: shineRev; }
@keyframes shineRev { from { translate: 130% 0; } to { translate: -130% 0; } }
</style>

<script>
'use strict';
/* =====================================================================
   TopShelf home screen. Runs inside the Android WebView, where
   window.TopShelf is the native bridge. In a normal browser a mock
   bridge is used so the layout can be previewed.
   ===================================================================== */

const B = window.TopShelf || mockBridge();
const $ = s => document.querySelector(s);
const body = document.body;

// ---- Layout (rem; 1rem = 16px at 1080p). Landscape keeps one tile size on every screen;
// a phone held upright (portrait) gets 3 bigger columns and a tab bar along the bottom. ----
let GAP = 2.75, TW = 19.4, TH = TW * 9 / 16, DOCK_PANEL_H = TH + 6.2, PITCH = TH + 5.8;
let SW = 120, SH = 67.5, COLS = 5, M = 6, DOCK_PANEL_Y = 0, DOCK_Y = 0, DRAWER_X = 3, DRAWER_Y = 8.8;
let PORTRAIT = false, SAFE_T = 0, SAFE_B = 0;      // SAFE_*: camera cutout, in px
const TABBAR_SPACE = 13;                          // rem kept free for the bottom tab bar (portrait)
function remProbe() {
  let p = document.getElementById('remprobe');
  if (!p) {
    p = document.createElement('div');
    p.id = 'remprobe';
    p.style.cssText = 'position:absolute;left:-9999px;top:0;width:100rem;height:0;visibility:hidden;pointer-events:none';
    document.body.appendChild(p);
  }
  return p.getBoundingClientRect().width / 100 || 16;
}
let REM = 0;
function computeLayout() {
  const r = REM = remProbe();
  const st = document.getElementById('stage');
  const w = (st && st.clientWidth) || window.innerWidth, h = (st && st.clientHeight) || window.innerHeight;
  PORTRAIT = !!(w && h && h > w * 1.05);
  document.body.classList.toggle('portrait', PORTRAIT);
  if (PORTRAIT) {
    SW = w / r; SH = h / r;
    COLS = 3; GAP = 2.2;
    TW = (SW - 8 - (COLS - 1) * GAP) / COLS;
  } else {
    SW = w && h ? Math.max(120, w / r) : 120;
    SH = w && h ? Math.max(67.5, h / r) : 67.5;
    GAP = 2.75; TW = 19.4;
    COLS = Math.max(5, Math.min(8, Math.floor((SW - 9 + GAP) / (TW + GAP))));   // at least ~4.5rem side margins
  }
  TH = TW * 9 / 16; DOCK_PANEL_H = TH + 6.2; PITCH = TH + 5.8;
  document.documentElement.style.setProperty('--tw', TW.toFixed(3) + 'rem');
  M = (SW - COLS * TW - (COLS - 1) * GAP) / 2;     // centre the columns
  const bottomRes = PORTRAIT ? TABBAR_SPACE + SAFE_B / r : 0;
  DOCK_PANEL_Y = SH - 2.8 - DOCK_PANEL_H - bottomRes;   // dock sits at the bottom of the screen (above the tab bar)
  DRAWER_Y = PORTRAIT ? 11 + SAFE_T / r : 8.8;
  DRAWER_X = Math.max(1.2, Math.min(3, M - 3));     // panels keep ~3rem of glass around the tiles
  DOCK_Y = DOCK_PANEL_Y + 1.6;                     // top of dock tiles
  document.documentElement.style.setProperty('--sw', SW.toFixed(3));
  document.documentElement.style.setProperty('--sh', SH.toFixed(3));
}
computeLayout();
const GRID_Y = 3;                                 // first row inside the drawer
let gridOff = 0;                                  // how far the drawer is scrolled

// ---- Settings ----
// photo sources that aren't Reddit (Reddit shut its open feeds in 2026): Wikimedia Commons' featured pictures, Bing
const PHOTO_SOURCES = { '@landscapes': 'Landscapes', '@mountains': 'Mountains', '@water': 'Lakes & coasts', '@night': 'Night skies', '@cities': 'Cities', '@featured': 'Featured pictures', '@bing': 'Bing photo of the day' };
function srcLabel(sub) { return PHOTO_SOURCES[sub] ? PHOTO_SOURCES[sub] + (sub === '@bing' ? '' : ' · Wikimedia') : 'r/' + sub; }
const SUB_PRESETS = ['EarthPorn', 'wallpapers', 'SkyPorn', 'CityPorn', 'spaceporn', 'WidescreenWallpaper', 'ExposurePorn'];
const SORTS = [['top-week', 'Top this week'], ['top-month', 'Top this month'], ['top-year', 'Top this year'],
               ['top-all', 'Top of all time'], ['hot', 'Hot right now'], ['new', 'Newest']];
const EVERY = [[15, '15 seconds'], [30, '30 seconds'], [60, '1 minute'], [120, '2 minutes'], [300, '5 minutes']];
const HOME_STYLES = [['classic', 'Classic (widgets & apps)'], ['gallery', 'Gallery (just your photo)'], ['billboard', 'Featured (movies, shows & games)']];
const MENU_STYLES = [['panel', 'Glass panel (original)'], ['rail', 'Icon rail'], ['card', 'Floating card'], ['glance', "Menu + what's on"]];
const BAR_STYLES = [['classic', 'Two pills (original)'], ['float', 'Floating'], ['strip', 'Glass strip'], ['capsule', 'One capsule']];
const CLOCKS = [['12', '12-hour'], ['24', '24-hour'], ['off', 'Hidden']];

const DEFAULTS = { sub: '@landscapes', subs: SUB_PRESETS.slice(), sort: 'top-week', every: 30, motion: true, clock: '12', glass: 'liquid' };
let S = Object.assign({}, DEFAULTS, readJSON('settings', {}));
let order = readJSON('order', []);
let hidden = readJSON('hidden', []);

// Apps that land in the dock by default (first launch only), matched on name.
const DOCK_HINTS = ['youtube', 'nuvio', 'netflix', 'plex', 'disney', 'max', 'prime video', 'hulu', 'stremio',
                    'apple tv', 'jellyfin', 'kodi', 'spotify', 'paramount', 'peacock', 'twitch'];

// ---- State ----
let apps = [];        // from Android
let items = [];       // what's on screen (apps + settings tile)
let focus = 0;
let mode = 'grid';
let tab = 'home';       // home | live
// modes: grid | shelf | menu | settings | move | edit | top | live | player
const isVodTab = () => tab === 'movies' || tab === 'series';
const isVodMode = () => mode === 'vod';
function baseMode() { return tab === 'live' ? 'live' : isVodTab() ? 'vod' : tab === 'sports' ? 'sports' : 'grid'; }
let cellEls = new Map();
const SETTINGS_ITEM = { id: '__settings', label: 'Settings', special: true };

function readJSON(key, fallback) {
  try { const v = B.getPref(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function writeJSON(key, v) { try { B.setPref(key, JSON.stringify(v)); } catch (e) {} }

/* =========================== Apps =========================== */

function loadApps() {
  try { apps = JSON.parse(B.getApps()) || []; } catch (e) { apps = []; }
  if (!order.length) {
    // First run: favourites first, then alphabetical.
    const rank = a => {
      const l = a.label.toLowerCase();
      const i = DOCK_HINTS.findIndex(h => l === h || l.startsWith(h + ' ') || l.startsWith(h));
      return i < 0 ? 999 : i;
    };
    apps.sort((a, b) => rank(a) - rank(b) || a.label.localeCompare(b.label));
    order = apps.map(a => a.id);
    writeJSON('order', order);
  }
  buildItems();
}

function buildItems() {
  const byId = new Map(apps.map(a => [a.id, a]));
  const hid = new Set(hidden);
  const list = [];
  for (const id of order) if (byId.has(id)) { if (!hid.has(id)) list.push(byId.get(id)); byId.delete(id); }
  for (const a of apps) if (byId.has(a.id) && !hid.has(a.id)) list.push(a);   // newly installed apps go last
  items = list.concat([SETTINGS_ITEM]);
}

function saveOrder() {
  const shown = items.filter(i => !i.special).map(i => i.id);
  const rest = order.filter(id => !shown.includes(id));
  order = shown.concat(rest);
  writeJSON('order', order);
}

function iconUrl(a, banner) {
  return 'https://topshelf.local/icon/' + encodeURIComponent(a.id) + (banner ? '?b=1' : '');
}

function shade(hex, amt) {
  const n = parseInt((hex || '#2a2a2e').slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c + (amt > 0 ? (255 - c) * amt : c * amt))));
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

function makeCell(a) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const tile = document.createElement('div');
  tile.className = 'tile';
  if (a.special) {
    tile.classList.add('gear');
    tile.innerHTML = GEAR;
  } else if (typeof customTile === 'function' && customTile(tile, a)) {
    // a look you picked (Change icon)
  } else if (a.banner) {
    const img = new Image();
    img.className = 'banner';
    img.decoding = 'async';
    img.src = iconUrl(a, true);
    img.onerror = () => { img.remove(); fillIcon(tile, a); };
    tile.appendChild(img);
  } else {
    fillIcon(tile, a);
  }
  tile.insertAdjacentHTML('beforeend', '<div class="gloss"></div><div class="shine"></div><div class="rim"></div>');
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = a.label;
  cell.append(tile, label);
  return cell;
}

function fillIcon(tile, a) {
  tile.style.background = `linear-gradient(160deg, ${shade(a.tint, .18)}, ${shade(a.tint, -.25)})`;
  if (a.mock) {
    tile.insertAdjacentHTML('afterbegin', `<div class="glyph">${esc(a.label.slice(0, 1))}</div>`);
    return;
  }
  const img = new Image();
  img.className = 'ico';
  img.decoding = 'async';
  img.src = iconUrl(a, false);
  img.onerror = () => { img.remove(); tile.insertAdjacentHTML('afterbegin', `<div class="glyph">${esc(a.label.slice(0, 1))}</div>`); };
  tile.prepend(img);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// Position inside the cell's own container (the dock, or the drawer's scrolling grid).
function pos(i) {
  const r = Math.floor(i / COLS), c = i % COLS;
  return r === 0 ? { x: M + c * (TW + GAP), y: DOCK_Y }
                 : { x: M - DRAWER_X + c * (TW + GAP), y: GRID_Y + (r - 1) * PITCH };
}
// Scroll the drawer just enough to show a row (remote control); touch scrolls it natively.
function revealDrawerRow(rr) {
  const sc = $('#gridscroll'), r = remPx();
  if (!sc || !sc.clientHeight) return;
  const top = (GRID_Y + rr * PITCH - 1.5) * r, bot = (GRID_Y + rr * PITCH + PITCH) * r;
  if (top < sc.scrollTop) sc.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  else if (bot > sc.scrollTop + sc.clientHeight) sc.scrollTo({ top: bot - sc.clientHeight, behavior: 'smooth' });
}
// Position on screen (for placing the app menu next to a tile).
function screenPos(i) {
  const r = Math.floor(i / COLS), c = i % COLS;
  gridOff = ($('#gridscroll').scrollTop || 0) / remPx();
  return { x: M + c * (TW + GAP), y: r === 0 ? DOCK_Y : DRAWER_Y + GRID_Y + (r - 1) * PITCH - gridOff };
}

function render() {
  const dockWrap = $('#dockcells'), gridWrap = $('#gridwrap');
  const keep = new Set(items.map(i => i.id));
  for (const [id, el] of cellEls) if (!keep.has(id)) { el.remove(); cellEls.delete(id); }
  items.forEach((a, i) => {
    let el = cellEls.get(a.id);
    if (!el) { el = makeCell(a); cellEls.set(a.id, el); }
    const home = i < COLS ? dockWrap : gridWrap;
    if (el.parentNode !== home) home.appendChild(el);
    const p = pos(i);
    el.classList.toggle('r0', i < COLS);
    el.style.setProperty('--x', p.x + 'rem');
    el.style.setProperty('--y', p.y + 'rem');
  });
  $('#gridwrap').style.height = (GRID_Y + Math.max(1, Math.ceil((items.length - COLS) / COLS)) * PITCH + 1) + 'rem';
  focus = Math.max(0, Math.min(focus, items.length - 1));
  applyFocus();
}

function applyFocus() {
  if (typeof moveLight === 'function') moveLight();
  items.forEach((a, i) => cellEls.get(a.id).classList.toggle('focus', i === focus && tab === 'home' && mode !== 'shelf' && mode !== 'top'));
  const row = Math.floor(focus / COLS);
  const deep = row >= 1 && mode !== 'shelf' && tab === 'home';
  body.classList.toggle('deep', deep);
  body.classList.toggle('hasdrawer', items.length > COLS);
  if (deep) revealDrawerRow(row - 1);
  if (window.tshelfUpdate) tshelfUpdate();
}

function bump(dir) {
  const el = cellEls.get(items[focus].id);
  const cls = 'bump-' + dir;
  el.classList.remove('bump-l', 'bump-r', 'bump-u', 'bump-d');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 340);
}

function moveFocus(dir) {
  const n = items.length, c = focus % COLS;
  let next = focus;
  if (dir === 'l') { if (c > 0) next = focus - 1; }
  else if (dir === 'r') { if (c < COLS - 1 && focus + 1 < n) next = focus + 1; }
  else if (dir === 'u') {
    if (focus >= COLS) next = focus - COLS;
    else { if (window.tshelfEnter && tshelfEnter()) return; return enterTop(); }
  }
  else if (dir === 'd') {
    if (focus + COLS < n) next = focus + COLS;
    else if (Math.floor(focus / COLS) < Math.floor((n - 1) / COLS)) next = n - 1;
  }
  if (next === focus) return bump(dir);
  focus = next;
  applyFocus();
  tilt(dir);
}

function activate() {

let photos = [], pIndex = -1, slideTimer = null, layer = 0, reqId = 0, lastFetch = 0, paused = false, showToken = 0;

function cleanTitle(t) {
  return String(t || '')
    .replace(/\[[^\]]*\]/g, '')
    .replace(/\((?:oc|[^)]*\d{3,5}\s*[x×]\s*\d{3,5}[^)]*)\)/gi, '')
    .replace(/\b\d{3,5}\s*[x×]\s*\d{3,5}\b/g, '')
    .replace(/\bOC\b/g, '')
    .replace(/\s+([,.!?])/g, '$1')
    .replace(/[\s,;:|-]+$/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

let photoStatus = 'Loading…';

function loadPhotos(force) {
  const now = Date.now();
  if (!force && now - lastFetch < 45 * 60 * 1000) return;
  lastFetch = now;
  let cached = null;
  try { cached = B.getCachedPhotos(S.sub, S.sort); } catch (e) {}
  if (cached) { try { setPhotos(JSON.parse(cached), false); } catch (e) {} }
  photoStatus = 'Loading…';
  const id = String(++reqId);
  try { B.fetchPhotos(S.sub, S.sort, id); } catch (e) { window.tsPhotos(id, null, 'bridge error'); }
}

window.tsRedditSignedIn = () => {
  toast('Signed in to Reddit');
  if (!PHOTO_SOURCES[S.sub]) { photos = []; lastFetch = 0; loadPhotos(true); }
  refreshSettings();
};
window.tsPhotos = (id, json, err) => {
  if (id !== String(reqId)) return;
  if (json) {
    const list = JSON.parse(json);
    let note = ''; try { note = B.photoNote ? B.photoNote() : ''; } catch (e) {}
    photoStatus = `${list.length} photos${note}`;
    setPhotos(list, true);
    refreshSettings();
    return;
  }
  photoStatus = `Failed — ${err || 'unknown error'}`;
  if (!photos.length) body.classList.add('nophotos');
  toast(`Couldn't load ${srcLabel(S.sub)} — details in Settings`);
  refreshSettings();
};

function setPhotos(list, fresh) {
  if (!Array.isArray(list) || !list.length) return;
  const same = photos.length === list.length && photos.every((p, i) => p.img === list[i].img);
  if (same) return;
  const hadPhotos = photos.length > 0 && !body.classList.contains('nophotos');
  photos = list.slice();
  for (let i = photos.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [photos[i], photos[j]] = [photos[j], photos[i]]; }
  pIndex = -1;
  if (!hadPhotos || !fresh) showPhoto(1);
  else scheduleSlide();
}

let imgFailures = 0;
function showPhoto(step, tries = 0) {
  if (!photos.length) return;
  if (tries >= Math.min(photos.length, 8)) {
    photoStatus = `${photos.length} photos found, but the images wouldn't load`;
    if (body.classList.contains('nophotos')) toast('Photos found but images failed to load — see Settings');
    refreshSettings();
    return;
  }
  pIndex = (pIndex + step + photos.length) % photos.length;
  const p = photos[pIndex];
  const token = ++showToken;
  // screen-sized copy first (much lighter for the TV), then the original links
  const urls = [photoSized(p.img), p.img, p.full ? photoSized(p.full) : null, p.full].filter((u, i, a) => u && a.indexOf(u) === i);
  const tryUrl = url => {
    const img = new Image();
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.onload = () => {
      if (token !== showToken) return;          // a newer photo was requested meanwhile
      const layers = document.querySelectorAll('.bgimg');
      const next = layers[layer ^ 1], cur = layers[layer];
      next.style.backgroundImage = `url("${url.replace(/"/g, '%22')}")`;
      next.style.setProperty('--kbdur', (S.every + 6) + 's');
      next.style.setProperty('--kx', (Math.random() * 3 - 1.5).toFixed(2) + '%');
      next.style.setProperty('--ky', (Math.random() * 2 - 1).toFixed(2) + '%');
      next.classList.remove('kb');
      void next.offsetWidth;
      if (S.motion) next.classList.add('kb');
      next.classList.add('show');
      cur.classList.remove('show');
      layer ^= 1;
      body.classList.remove('nophotos');
      if (window.onPhotoShown) onPhotoShown();
      setCaption(p);
      if ((S.look || 'glass') === 'ink') lookInk(img);       // (Photo Ink: the panels take this photo's colour)
      scheduleSlide();
    };
    img.onerror = () => {
      if (token !== showToken) return;
      const nextUrl = urls[urls.indexOf(url) + 1];
      if (nextUrl) return tryUrl(nextUrl);                     // refused: try the next link
      showPhoto(step >= 0 ? 1 : -1, tries + 1);
    };
    img.src = url;
  };
  tryUrl(urls[0]);
  // preload the one after
  const after = photos[(pIndex + 1) % photos.length];
  if (after) { const pre = new Image(); pre.referrerPolicy = 'no-referrer'; pre.src = photoSized(after.img); }
}

  tp = null;
  if (flinging && Math.hypot(dx, dy) < 12) return;     // that tap just caught a moving list
  const r = remPx();
  if (Math.abs(dx) > 4 * r || Math.abs(dy) > 4 * r) {
    swipe(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'l' : 'r') : (dy < 0 ? 'u' : 'd'), t, Math.max(Math.abs(dx), Math.abs(dy)) / r);
  } else {
    const box = stageEl.getBoundingClientRect();
    tap(t, (e.clientY - box.top) / r);
  }
});

function swipe(dir, t, distRem) {           // dir = the way the finger moved
  if (mode === 'search' || mode === 'menu' || mode === 'spick' || mode === 'link' || mode === 'icpick' || mode === 'sheet') return;
  if (isVodTab() || tab === 'sports') return;   // lists scroll natively there
  if (tab === 'live' && (mode === 'live' || mode === 'player' || mode === 'multi')) { liveSwipe(dir, t, distRem); return; }
  if (mode === 'shelf') {
    if (dir === 'l') showPhoto(1); else if (dir === 'r') showPhoto(-1); else exitShelf();
    return;
  }
  if (mode !== 'grid') return;
  const row = Math.floor(focus / COLS);
  if (dir === 'u') moveFocus('d');
  else if (dir === 'd') { if (row === 0) enterShelf(); else moveFocus('u'); }
}

function tap(t, yRem) {
  if (mode === 'search') return searchTap(t);
  if (mode === 'spick') return spPickTap(t);
  if (mode === 'link') return linkTap(t);
  if (mode === 'icpick') return icTap(t);
  if (mode === 'sheet') return sheetTap(t);
  if (mode === 'menu') {
    const mi = t.closest('.mi');
    if (mi) { menuSel = [...$('#menu').querySelectorAll('.mi')].indexOf(mi); menuPick(); } else if (!t.closest('#menu')) closeMenu();
    return;
  }
  if (mode === 'settings' || mode === 'edit') {
    if (!t.closest('#settings')) return closeSettings();
    if (t.closest('.sback')) return settingsBack();
    const row = t.closest('.srow');
    if (!row || mode === 'edit') return;
    sSel = [...$('#srows').children].indexOf(row);
    const r = sRows[sSel];
    if (sSel !== 0 && r.cycle && t.closest('.val')) r.cycle(1);
    else if (r.edit) startEdit(sSel);
    else if (r.ok) r.ok();
    else if (r.cycle) r.cycle(1);
    if (mode === 'settings') drawSettings();
    return;
  }
  if (mode === 'shelf') return exitShelf();
  if (mode === 'move') return endMove();
  const tb = t.closest('.tb, .tab');
  if (tb) { if (mode === 'top') exitTop(); return topActivate(topEls().indexOf(tb)); }
  if (mode === 'top') exitTop();
  if (tab === 'live') { liveTap(t); return; }
  if (isVodTab()) { vodTap(t); return; }
  if (tab === 'sports') { spTap(t); return; }
  if (t.closest('#hint')) { if (items.length > COLS) { focus = COLS; applyFocus(); } return; }
  if (t.closest('.tsc')) { tshelfTap(t); return; }
  const i = cellIndexOf(t);
  if (i >= 0) { focus = i; applyFocus(); activate(); return; }
  if (body.classList.contains('deep')) {             // tapped outside the drawer: close it
    if (!t.closest('#drawer')) { focus = focus % COLS; applyFocus(); }
    return;
  }
  if (yRem < DOCK_PANEL_Y - 1) enterShelf();
}

/* =========================== Liquid Glass =========================== */
// Each glass panel gets an SVG displacement filter used as its backdrop-filter: the photo
// behind the panel is bent toward the middle near the rounded edges, like thick glass.
const SVG_NS = 'http://www.w3.org/2000/svg';
const glassDefs = (() => {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
  svg.style.position = 'absolute';
  const defs = document.createElementNS(SVG_NS, 'defs');
  svg.appendChild(defs);
  document.body.appendChild(svg);
  return defs;
})();
const glassKeys = new WeakMap();

const LENSMAPS = new Map();
function lensMap(w, h, r, bezel) {
  const k = 0.5, cw = Math.max(2, Math.round(w * k)), ch = Math.max(2, Math.round(h * k));
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(cw, ch), D = img.data;
  const hw = w / 2, hh = h / 2, rr = Math.min(r, hw, hh);
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const px = (x + .5) / k - hw, py = (y + .5) / k - hh;
      const qx = Math.abs(px) - (hw - rr), qy = Math.abs(py) - (hh - rr);
      let nx, ny, dist;
      if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; dist = rr - l; nx = qx / l; ny = qy / l; }
      else if (qx > qy) { dist = rr - qx; nx = 1; ny = 0; }
      else { dist = rr - qy; nx = 0; ny = 1; }
      nx *= px < 0 ? -1 : 1; ny *= py < 0 ? -1 : 1;
      let m = 0;
      if (dist >= 0 && dist < bezel) { const t = 1 - dist / bezel; m = t * t; }
      const i = (y * cw + x) * 4;
      D[i] = 128 - nx * m * 127; D[i + 1] = 128 - ny * m * 127; D[i + 2] = 128; D[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}

function liquid(el, blurRem) {
  const w = el.offsetWidth, h = el.offsetHeight;
  if (!w || !h) return false;
  const rem = remPx();
  const r = parseFloat(getComputedStyle(el).borderTopLeftRadius) || rem * 2;
  const id = 'lq-' + el.id;
  const key = `${w}x${h}x${r}`;
  if (glassKeys.get(el) !== key) {
    glassKeys.set(el, key);
    let f = document.getElementById(id);
    if (!f) { f = document.createElementNS(SVG_NS, 'filter'); f.id = id; glassDefs.appendChild(f); }
    for (const [a, v] of [['x', 0], ['y', 0], ['width', w], ['height', h], ['filterUnits', 'userSpaceOnUse'],
                          ['primitiveUnits', 'userSpaceOnUse'], ['color-interpolation-filters', 'sRGB']]) f.setAttribute(a, v);
    const bezel = Math.min(r * 1.2, h * 0.45, rem * 3);
    const q = v => Math.ceil(v / 64) * 64;
    const mk = `${q(w)}x${q(h)}x${Math.round(r)}x${Math.round(bezel)}`;
    const map = LENSMAPS.get(mk) || (LENSMAPS.set(mk, lensMap(q(w), q(h), r, bezel)), LENSMAPS.get(mk));
    f.innerHTML = `<feImage href="${map}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="map"/>` +
                  `<feDisplacementMap in="SourceGraphic" in2="map" scale="${Math.round(rem * 3.4)}" xChannelSelector="R" yChannelSelector="G"/>`;
  }
  const bf = `url(#${id}) blur(${(blurRem * rem).toFixed(1)}px) saturate(1.9) brightness(1.06)`;
  el.style.backdropFilter = bf;
  el.style.webkitBackdropFilter = bf;
  return true;
}

/* Settings › Home › Look on the page's own panels (the phone held upright): the same five looks as the app */
function lookPanel(el) {
  const lk = S.look || 'glass';
  if (lk === 'glass') { if (el.dataset.looked) { el.style.boxShadow = ''; el.style.borderRadius = ''; delete el.dataset.looked; } return false; }
  el.dataset.looked = '1';
  el.style.backdropFilter = el.style.webkitBackdropFilter = 'none';
  if (lk === 'air') { el.style.background = 'rgba(11,11,13,.94)'; el.style.borderRadius = '0'; el.style.boxShadow = 'inset .42rem 0 0 #E8412F'; }
  else if (lk === 'shelf') {
    el.style.background = 'rgba(21,18,23,.97)'; el.style.borderRadius = '.55rem';
    el.style.boxShadow = 'inset 0 .24rem 0 var(--look-light, #FFC983), inset 0 4.6rem 3.4rem -3.2rem color-mix(in srgb, var(--look-light, #FFC983) 55%, transparent), inset 0 -.12rem 0 color-mix(in srgb, var(--look-light, #FFC983) 45%, transparent)';
  }
  else if (lk === 'ink') { el.style.background = 'var(--look-ink, #1F2E45)'; el.style.borderRadius = '.9rem'; el.style.boxShadow = '.5rem .5rem 0 color-mix(in srgb, var(--look-ink, #1F2E45) 45%, #000), inset 0 0 0 .12rem color-mix(in srgb, var(--look-paper, #F4E3C8) 35%, transparent)'; }
  else if (lk === 'spot') { el.style.background = 'radial-gradient(ellipse at 50% 45%, rgba(6,8,16,.84), rgba(6,8,16,.62) 55%, rgba(6,8,16,.2))'; el.style.boxShadow = 'none'; }
  return true;
}
/* the look's colours: the shelf's light by the time of day, the ink and paper from the photo on screen */
function applyLook() {
  const lk = S.look || 'glass';
  ['glass', 'shelf', 'ink', 'air', 'spot'].forEach(x => body.classList.toggle('look-' + x, x === lk));
  const hr = new Date().getHours();
  body.style.setProperty('--look-light', hr >= 7 && hr < 17 ? '#D3E4FF' : '#FFC983');
  if (lk === 'ink') lookInk();
}
let lookImg = null;
function lookInk(img) {
  if (img) lookImg = img; else img = lookImg;
  try {
    if (!img || !img.naturalWidth) return;
    const cv = document.createElement('canvas'); cv.width = 32; cv.height = 18;
    const x = cv.getContext('2d'); x.drawImage(img, 0, 0, 32, 18);
    const d = x.getImageData(0, 0, 32, 18).data;         // (throws for a picture from a site that doesn't allow it: the default ink stays)
    let cx = 0, cy = 0, ws = 0, ss = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx, s = mx ? (mx - mn) / mx : 0;
      let hh = 0; if (mx !== mn) hh = mx === r ? ((g - b) / (mx - mn)) % 6 : mx === g ? (b - r) / (mx - mn) + 2 : (r - g) / (mx - mn) + 4;
      hh *= 60; const w = s * (.35 + v);
      cx += Math.cos(hh * Math.PI / 180) * w; cy += Math.sin(hh * Math.PI / 180) * w; ws += w; ss += s; n++;
    }
    const hue = ws < .001 ? 220 : (Math.atan2(cy, cx) * 180 / Math.PI + 360) % 360;
    const sat = Math.max(.45, Math.min(.8, ss / n * 1.3 * 1.25));
    body.style.setProperty('--look-ink', `hsl(${hue.toFixed(0)} ${(sat * 100 * .62).toFixed(0)}% 24%)`);
    body.style.setProperty('--look-paper', `hsl(${hue.toFixed(0)} 40% 92%)`);
  } catch (e) {}
}
function styleGlass(el) {
  if (lookPanel(el)) return;
  const blur = parseFloat(el.dataset.blur || '.4');
  const tint = el.dataset.tint || 'rgba(255,255,255,.06)';
  if (S.glass === 'solid') {
    el.style.backdropFilter = el.style.webkitBackdropFilter = 'none';
    el.style.background = 'rgba(30,30,34,.94)';
    return;
  }
  el.style.background = tint;
  try { if (S.glass === 'liquid' && el.dataset.lens !== '0' && liquid(el, blur)) return; } catch (e) { /* fall back to frosted */ }
  const bf = `blur(${Math.max(blur, 1.4)}rem) saturate(1.7)`;
  el.style.backdropFilter = el.style.webkitBackdropFilter = bf;
}

function applyGlassMode() {
  applyLook();
  body.classList.remove('glass-liquid', 'glass-frosted', 'glass-solid');
  body.classList.add('glass-' + S.glass);
  document.querySelectorAll('.glass').forEach(styleGlass);
}
/* Re-measure whenever the screen area changes size. Android's web view can start before it
   knows its real size, so this also runs right after start-up. */
let lastLayoutKey = '';
function relayout() {
  computeLayout();
  const key = SW.toFixed(2) + 'x' + SH.toFixed(2);
  if (key === lastLayoutKey) return;
  lastLayoutKey = key;
  const turned = lastPortrait !== PORTRAIT;
  lastPortrait = PORTRAIT;
  placeDock();
  render();
  applyGlassMode();
  if (turned) { if (mode === 'menu') closeMenu(); if (window.onTurn) onTurn(); }
  if (typeof tab !== 'undefined' && tab === 'live' && window.lvRenderWindow) lvRenderWindow();
}
let lastPortrait = null;
function placeDock() {
  $('#dock').style.top = DOCK_PANEL_Y + 'rem';
  for (const id of ['#dock', '#drawer']) { $(id).style.left = $(id).style.right = DRAWER_X + 'rem'; }
  $('#hint').style.top = PORTRAIT ? (DOCK_PANEL_Y - 3.2) + 'rem' : '';
  const ts = $('#tshelf');
  ts.style.top = (DOCK_PANEL_Y - (PORTRAIT ? 28 : 18.2)) + 'rem';
  ts.style.left = ts.style.right = DRAWER_X + 'rem';
}
function applyInsets(l, r, t, b) {
  const root = document.documentElement.style;
  root.setProperty('--safe-l', (+l || 0) + 'px');
  root.setProperty('--safe-r', (+r || 0) + 'px');
  root.setProperty('--safe-t', (+t || 0) + 'px');
  root.setProperty('--safe-b', (+b || 0) + 'px');
  SAFE_T = +t || 0; SAFE_B = +b || 0;
  lastLayoutKey = '';
  requestAnimationFrame(relayout);
}
window.tsInsets = (l, r, t, b) => applyInsets(l, r, t, b);
try { const v = (B.safeInsets ? B.safeInsets() : '0,0,0,0').split(','); applyInsets(v[0], v[1], v[2], v[3]); } catch (e) {}
window.addEventListener('resize', () => requestAnimationFrame(relayout));
// belt and braces: if anything ever nudges the page itself, put it back
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
document.getElementById('stage').addEventListener('scroll', e => { const s = e.currentTarget; if (s.scrollLeft || s.scrollTop) { s.scrollLeft = 0; s.scrollTop = 0; } });
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(relayout)).observe(document.getElementById('stage'));
window.addEventListener('load', relayout);
[100, 500, 1500].forEach(ms => setTimeout(relayout, ms));

/* Light follows focus: the dock's glow and every rim highlight swing toward the focused app. */
function moveLight() {
  const col = focus % COLS;
  const dock = $('#dock');
  dock.style.setProperty('--fx', (10 + col * 80 / Math.max(1, COLS - 1)) + '%');
  document.documentElement.style.setProperty('--la', (100 + col * 88 / Math.max(1, COLS - 1)) + 'deg');
}

/* A small tvOS-style tilt toward the direction you moved, springing back to flat. */
function tilt(dir) {
  const el = cellEls.get(items[focus].id);
  if (!el) return;
  const rot = { l: 'y -5deg', r: 'y 5deg', u: 'x 5deg', d: 'x -5deg' }[dir];
  el.classList.toggle('rev', dir === 'l');
  if (!rot) return;
  el.style.setProperty('--rot', rot);
  setTimeout(() => el.style.setProperty('--rot', 'y 0deg'), 140);
}

/* =========================== Start =========================== */

placeDock();
applyMotion();
applyGlassMode();
tick();
setInterval(tick, 5000);
loadApps();
render();
loadPhotos(true);

/* =========================== Browser preview =========================== */
function mockBridge() {
  const store = {};
  try { Object.assign(store, JSON.parse(localStorage.getItem('topshelf-mock') || '{}')); } catch (e) {}
  const persist = () => { try { localStorage.setItem('topshelf-mock', JSON.stringify(store)); } catch (e) {} };
  const names = [['YouTube', '#c4302b'], ['Nuvio', '#5b3fd1'], ['Netflix', '#8f0a12'], ['Plex', '#c98b06'], ['Disney+', '#123b8f'],
    ['Max', '#2d2fd6'], ['Prime Video', '#0f79af'], ['Spotify', '#178a42'], ['Hulu', '#11865a'], ['Twitch', '#6441a5'],
    ['Kodi', '#1f6f99'], ['Photos', '#c2410c'], ['Play Store', '#0b8043'], ['Files', '#3b5bdb'], ['Stremio', '#4b3b8f'], ['Chrome', '#1a73e8']];
  const list = names.map(([label, tint], i) => ({ id: 'mock/' + i, pkg: 'mock' + i, label, banner: false, tint, mock: true }));
  return {
    getApps: () => JSON.stringify(list),
    launch: id => { toast('Would open ' + (list.find(a => a.id === id) || {}).label); return true; },
    appInfo: () => toast('Would open App info'),
    openSettings: () => toast('Would open Android settings'),
    openAccessibilitySettings: () => {},
    openStockHome: () => toast('Would open Google TV home'),
    homeStatus: () => 'off',
    setRedirect: () => {},
    getPref: k => store[k] || null,
    setPref: (k, v) => { store[k] = v; persist(); },
    getVersion: () => 'preview',
    getCachedPhotos: () => null,
    liveInfo: () => JSON.stringify({ m3u: store.m3u || '', epg: store.epg || '', status: '', updated: 0 }),
    liveSetUrls: (m, e) => { store.m3u = m; store.epg = e; persist(); },
    liveChannels: () => '[]',
    livePrograms: () => '{}',
    liveRefresh: () => setTimeout(() => window.tsLiveDone(false, 'Failed: preview has no Android bridge'), 300),
    openExternal: () => toast('Would open another player'),
    openInStremioApp: () => '', openTrailer: () => toast('Would open the trailer'), safeInsets: () => '0,0',
    fetchPhotos: (sub, sort, id) => setTimeout(() => window.tsPhotos(id, null, 'no Android bridge'), 0)
  };
}
